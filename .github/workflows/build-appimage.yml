name: Build AppImage

on:
  push:
    paths:
      - ".github/workflows/build-appimage.yml"
      - "grix_app/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build x86_64 AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: grix_app/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libdbus-1-3 \
            libegl1 \
            libfuse2 \
            libgl1 \
            libx11-xcb1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon0

      - name: Run tests
        env:
          PYTHONPATH: grix_app
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s grix_app/tests -v

      - name: Download appimagetool
        env:
          APPIMAGETOOL_SHA256: e8c1169c4af66c3184d7ee110713d4be04befe671fa358e2c1591ee840553b03
        run: |
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output grix_app/appimagetool-x86_64.AppImage
          echo "${APPIMAGETOOL_SHA256}  grix_app/appimagetool-x86_64.AppImage" | sha256sum --check
          chmod +x grix_app/appimagetool-x86_64.AppImage

      - name: Build AppImage
        working-directory: grix_app
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash build_appimage.sh

      - name: Smoke-test packaged Python
        working-directory: grix_app/dist
        run: |
          ./Grix-x86_64.AppImage --appimage-extract
          ./squashfs-root/usr/pyenv/bin/python -c "import grix; import PyQt6.QtCore; print('Bundled Grix and PyQt6 imports succeeded')"

      - name: Create checksum and build summary
        run: |
          cd grix_app/dist
          sha256sum Grix-x86_64.AppImage > SHA256SUMS
          {
            echo "## AppImage build"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- File: \`Grix-x86_64.AppImage\`"
            echo "- SHA-256: \`$(cut -d ' ' -f 1 SHA256SUMS)\`"
            echo
            echo "Download the \`Grix-x86_64-AppImage\` artifact below. After extracting it, run \`chmod +x Grix-x86_64.AppImage\` before launching."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grix-x86_64-AppImage
          path: |
            grix_app/dist/Grix-x86_64.AppImage
            grix_app/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
